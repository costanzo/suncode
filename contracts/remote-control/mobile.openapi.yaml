openapi: 3.2.0
info:
  title: SunCode Mobile Remote Control API
  version: 1.0.0
  description: |
    HTTP API between the SunCode CMP Mobile client and the Java Remote Server.
    The Remote Server relays bounded requests to an outbound Desktop connection.
    It is not the Rust agent and never exposes provider wire payloads, secrets, or
    absolute Desktop filesystem paths.
  license:
    name: SunCode project license
    url: https://github.com/suncode-ai/suncode/blob/main/LICENSE
servers:
  - url: https://{remoteServerHost}
    description: Remote Server HTTPS endpoint
    variables:
      remoteServerHost:
        default: relay.suncode.example
tags:
  - name: Health
  - name: Pairing
  - name: Authentication
  - name: Hosts
  - name: Sessions
  - name: Synchronization
paths:
  /v1/mobile/health:
    parameters:
      - $ref: '#/components/parameters/HostHeader'
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: getHealth
      tags: [Health]
      security: []
      responses:
        '200':
          description: Remote Server health
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HealthData'
                  - $ref: '#/components/schemas/EncryptedPayload'
              examples:
                plaintext:
                  value:
                    status: ok
                    serverTime: "2026-10-02T01:47:22.778Z"
                encrypted:
                  value:
                    encPayload: "e2e-v1:base64url-ciphertext"
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/mobile/pairings/exchange:
    parameters:
      - $ref: '#/components/parameters/HostHeader'
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: exchangePairingCode
      tags: [Pairing]
      security: []
      summary: Exchange a one-time Server-generated Mobile pairing code
      description: |
        The code and X-Host-Id are provided by the Desktop-generated pairing QR
        link. The code was generated by the Remote Server and is bound to the
        Host ID returned by Desktop pairing; Desktop only transports it into the
        QR payload. The Host ID must match the one that issued the one-time code.
        A successful exchange consumes the code atomically and immediately.
        Reuse, expiry, a Host ID mismatch, or a failed Desktop pairing
        transaction never returns a credential. After a successful exchange, the Server notifies the paired Desktop using
        `mobile.pairings.exchange.succeeded`, correlated with this request's
        `X-Request-Id`. The notification never contains the pairing code or
        issued tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingExchangeRequest'
            examples:
              exchangePairingCode:
                summary: Pair a Mobile device with a Desktop
                value:
                  pairingCode: "482917"
                  deviceName: "Long's phone"
      responses:
        '200':
          description: Mobile credential and paired Host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingExchangeData'
              examples:
                pairingExchanged:
                  summary: Mobile credentials and paired Host
                  value:
                    accessToken: "opaque-access-token"
                    refreshToken: "opaque-refresh-token"
                    accessTokenExpiresAt: "2026-10-01T03:30:00Z"
                    host:
                      id: "host-01J8YQ6M7A"
                      displayName: "Development PC"
                      connectionState: "connected"
                      agentVersion: "0.1.0"
        '400':
          $ref: '#/components/responses/PlainInvalidRequest'
        '409':
          description: Pairing code was already consumed or pairing is pending elsewhere
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlainApiBaseRetError'
        '410':
          description: Pairing code expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlainApiBaseRetError'
        '503':
          $ref: '#/components/responses/PlainDesktopUnavailable'

  /v1/mobile/auth/refresh:
    parameters:
      - $ref: '#/components/parameters/HostHeader'
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: refreshAccessToken
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            examples:
              plaintext:
                value:
                  refreshToken: "opaque-refresh-token"
      responses:
        '200':
          description: Rotated access credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenData'
              examples:
                plaintext:
                  value:
                    accessToken: "opaque-access-token"
                    refreshToken: "opaque-refresh-token"
                    accessTokenExpiresAt: "2026-10-01T03:30:00Z"
        '401':
          $ref: '#/components/responses/PlainUnauthorized'

  /v1/mobile/auth/logout:
    parameters:
      - $ref: '#/components/parameters/HostHeader'
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: logoutCurrentDevice
      tags: [Authentication]
      summary: Log out the current Mobile device
      description: |
        This does not revoke any other Mobile device or Desktop pairing. After
        successfully invalidating the current credential, the Server notifies
        the paired Desktop using `mobile.auth.logout`, correlated with this
        request's `X-Request-Id`. The notification never contains an access or
        refresh token. The current contract has no stable Mobile device ID, so
        Desktop can observe the logout but cannot identify which Mobile device
        logged out when several are paired to the same Host.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Current device credential invalidated
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/mobile/hosts/{hostId}:
    parameters:
      - $ref: '#/components/parameters/HostHeader'
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: getHost
      tags: [Hosts]
      security:
        - bearerAuth: []
      parameters:
        - name: hostId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Host detail
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HostDetail'
                  - $ref: '#/components/schemas/EncryptedPayload'
              examples:
                plaintext:
                  value:
                    id: "host-01J8YQ6M7A"
                    displayName: "Development PC"
                    connectionState: connected
                    lastSeenAt: "2026-10-02T01:47:22.778Z"
                    agentVersion: "0.1.0"
                encrypted:
                  value:
                    encPayload: "e2e-v1:base64url-ciphertext"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/mobile/hosts/{hostId}/projects:
    parameters:
      - $ref: '#/components/parameters/HostHeader'
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: listHostProjects
      tags: [Hosts]
      description: Forwarded to Desktop as the `mobile.projects.list` SSE event.
      security:
        - bearerAuth: []
      parameters:
        - name: hostId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Projects exposed by the Host
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ProjectsData'
                  - $ref: '#/components/schemas/EncryptedPayload'
              examples:
                plaintext:
                  value:
                    items:
                      - id: "project-01J8YQ6M7C"
                        displayName: "suncode"
                        relativeRoot: "workspace"
                        activeSessionCount: 0
                encrypted:
                  value:
                    encPayload: "e2e-v1:base64url-ciphertext"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/mobile/hosts/{hostId}/sessions:
    parameters:
      - $ref: '#/components/parameters/HostHeader'
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: listSessions
      tags: [Sessions]
      summary: List active primary Sessions on one Host
      description: |
        Archived Sessions and child/subagent Sessions are excluded. The default
        response is scoped to the Host identified in the path; Project filtering is optional.
        Forwarded to Desktop as the `mobile.sessions.list` SSE event.
      security:
        - bearerAuth: []
      parameters:
        - name: hostId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/ProjectFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor-paginated active primary Sessions
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionPageData'
                  - $ref: '#/components/schemas/EncryptedPayload'
              examples:
                plaintext:
                  value:
                    items: []
                    nextCursor: null
                    hasMore: false
                encrypted:
                  value:
                    encPayload: "e2e-v1:base64url-ciphertext"
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createSession
      tags: [Sessions]
      summary: Create a primary Session on a Host Project
      description: Forwarded to the path Host as the `mobile.sessions.create` SSE event.
      security:
        - bearerAuth: []
      parameters:
        - name: hostId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CreateSessionRequest'
                - $ref: '#/components/schemas/EncryptedPayload'
            examples:
              withImages:
                summary: Create a Session with an initial image
                value:
                  projectId: project-01
                  title: Review screenshot
                  firstMessage: Please inspect this screenshot.
                  images:
                    - mimeType: image/png
                      data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAAB
                      fileName: screenshot.png
              encrypted:
                summary: End-to-end encrypted Session creation request
                value:
                  encPayload: "e2e-v1:base64url-ciphertext"
      responses:
        '201':
          description: Primary Session created. The response contains its ID so Mobile can immediately open its SSE stream.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionCreatedData'
                  - $ref: '#/components/schemas/EncryptedPayload'
              examples:
                plaintext:
                  value:
                    sessionId: "session-01J8YQ6M7D"
                encrypted:
                  summary: End-to-end encrypted Session creation response
                  value:
                    encPayload: "e2e-v1:base64url-ciphertext"
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DesktopUnavailable'

  /v1/mobile/hosts/{hostId}/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/HostHeader'
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: getSession
      tags: [Sessions]
      description: Forwarded to Desktop as the `mobile.sessions.get` SSE event.
      security:
        - bearerAuth: []
      parameters:
        - name: hostId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: sessionId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Session snapshot and current pending interaction
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionDetailData'
                  - $ref: '#/components/schemas/EncryptedPayload'
              examples:
                plaintext:
                  value:
                    id: "session-01J8YQ6M7B"
                    title: "Investigate remote control"
                    kind: primary
                    project:
                      id: "project-01J8YQ6M7C"
                      displayName: "suncode"
                    state: idle
                    updatedAt: "2026-10-02T01:45:10Z"
                    preview: "Review the remote control contract"
                    revision: 7
                    eventSequence: 42
                    archived: false
                    messages: []
                    pendingApproval: null
                    pendingQuestion: null
                encrypted:
                  value:
                    encPayload: "e2e-v1:base64url-ciphertext"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Session was archived elsewhere and is no longer in the mobile active projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseRetError'

  /v1/mobile/hosts/{hostId}/sessions/{sessionId}/events:
    parameters:
      - $ref: '#/components/parameters/HostHeader'
      - $ref: '#/components/parameters/LastEventId'
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: streamSessionEvents
      tags: [Sessions]
      summary: Stream one Session using Server-Sent Events
      description: |
        Opens a server-to-Mobile SSE stream for exactly one active primary
        Session. Without `Last-Event-ID`, the first application event is
        `session.snapshot`, followed by live `agent.event` frames. The snapshot
        is fetched from Desktop using the `mobile.sessions.events.open` SSE
        event, correlated to this request's `X-Request-Id`. The snapshot
        has its own stable SSE `id` and sequence. On a
        reconnect with a retained event ID, the server replays only events with
        a greater sequence before live delivery. The stream has no command
        channel. Heartbeats are SSE comments and do not advance the cursor.
      security:
        - bearerAuth: []
      parameters:
        - name: hostId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: sessionId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: UTF-8 text/event-stream for the selected Session
          headers:
            Cache-Control:
              description: Must include no-cache for a live stream.
              schema: { type: string }
            X-Session-Sequence:
              description: Current per-Session sequence at stream establishment.
              schema: { type: integer, minimum: 0 }
          content:
            text/event-stream:
              schema:
                type: array
                description: Sequential SSE stream represented as its parsed event items.
                items:
                  $ref: '#/components/schemas/SessionSseStreamItem'
              itemSchema:
                $ref: '#/components/schemas/SessionSseStreamItem'
              examples:
                snapshot:
                  summary: Initial Session snapshot
                  value:
                    - event: session.snapshot
                      id: host-01:42
                      data: '{"event_id":"host-01:42","session_id":"session-01","sequence":42,"session_revision":7,"snapshot":{"id":"session-01","title":"Investigate remote control","kind":"primary","project":{"id":"project-01","displayName":"suncode"},"state":"idle","updatedAt":"2026-10-01T02:30:00Z","preview":"Review the remote control contract","revision":7,"eventSequence":42,"archived":false,"messages":[],"pendingApproval":null,"pendingQuestion":null}}'
                agentEvent:
                  summary: Normalized Agent event
                  value:
                    - event: agent.event
                      id: host-01:43
                      data: '{"event_id":"host-01:43","sequence":43,"session_revision":8,"session_id":"session-01","occurred_at":"2026-10-01T02:31:00Z","event_type":"message.assistant","payload":{"message_id":"message-01","turn_id":"turn-01","call_id":null,"message":{"role":"assistant","content":[{"type":"text","text":"The contract is consistent."}]},"usage":{"input_tokens":120,"output_tokens":18,"total_tokens":138},"finish_reason":"stop"}}'
                encryptedEvent:
                  summary: End-to-end encrypted Session event
                  value:
                    - event: agent.event
                      id: host-01:44
                      data: '{"encPayload":"e2e-v1:base64url-ciphertext"}'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Last-Event-ID is outside the retained replay window; fetch a fresh snapshot and reconnect without the cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseRetError'
        '429':
          description: Stream admission is rate limited; retry after the indicated delay.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseRetError'
        '503':
          $ref: '#/components/responses/DesktopUnavailable'

  /v1/mobile/hosts/{hostId}/sessions/{sessionId}/messages:
    parameters:
      - $ref: '#/components/parameters/HostHeader'
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: sendSessionMessage
      tags: [Sessions]
      summary: Send one user message to a primary Session
      description: Forwarded to Desktop as the `mobile.sessions.messages.send` SSE event.
      security:
        - bearerAuth: []
      parameters:
        - name: hostId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: sessionId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SendMessageRequest'
                - $ref: '#/components/schemas/EncryptedPayload'
            examples:
              withImages:
                summary: Send a message with an image
                value:
                  text: Continue from this screenshot.
                  images:
                    - mimeType: image/jpeg
                      data: /9j/4AAQSkZJRgABAQAAAQABAAD
                      fileName: context.jpg
              encrypted:
                summary: End-to-end encrypted message request
                value:
                  encPayload: "e2e-v1:base64url-ciphertext"
      responses:
        '204':
          description: Message accepted for Desktop delivery
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DesktopUnavailable'

  /v1/mobile/hosts/{hostId}/sessions/{sessionId}/approvals/{approvalId}:
    parameters:
      - $ref: '#/components/parameters/HostHeader'
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: resolveApproval
      tags: [Sessions]
      summary: Resolve a pending Rust approval
      description: Forwarded to Desktop as the `mobile.sessions.approvals.resolve` SSE event.
      security:
        - bearerAuth: []
      parameters:
        - name: hostId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: sessionId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: approvalId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ApprovalResolutionRequest'
                - $ref: '#/components/schemas/EncryptedPayload'
            examples:
              plaintext:
                value:
                  action: allow_once
                  expectedRevision: 7
              encrypted:
                summary: End-to-end encrypted approval request
                value:
                  encPayload: "e2e-v1:base64url-ciphertext"
      responses:
        '204':
          description: Approval resolution accepted
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Stale revision or approval already resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseRetError'

  /v1/mobile/hosts/{hostId}/sessions/{sessionId}/questions/{questionId}/reply:
    parameters:
      - $ref: '#/components/parameters/HostHeader'
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: replyQuestion
      tags: [Sessions]
      summary: Answer a pending structured question
      description: Forwarded to Desktop as the `mobile.sessions.questions.reply` SSE event.
      security:
        - bearerAuth: []
      parameters:
        - name: hostId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: sessionId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: questionId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/QuestionReplyRequest'
                - $ref: '#/components/schemas/EncryptedPayload'
            examples:
              plaintext:
                value:
                  answers: ["Option A"]
                  expectedRevision: 8
              encrypted:
                summary: End-to-end encrypted question reply
                value:
                  encPayload: "e2e-v1:base64url-ciphertext"
      responses:
        '204':
          description: Answer accepted
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/mobile/hosts/{hostId}/sessions/{sessionId}/cancel:
    parameters:
      - $ref: '#/components/parameters/HostHeader'
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: cancelSessionTurn
      tags: [Sessions]
      summary: Request cooperative cancellation of the current turn
      description: Forwarded to Desktop as the `mobile.sessions.cancel` SSE event.
      security:
        - bearerAuth: []
      parameters:
        - name: hostId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: sessionId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '204':
          description: Cancellation accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/mobile/hosts/{hostId}/sessions/{sessionId}/retry:
    parameters:
      - $ref: '#/components/parameters/HostHeader'
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: retryLastTurn
      tags: [Sessions]
      summary: Retry the last failed turn
      description: Forwarded to Desktop as the `mobile.sessions.retry` SSE event.
      security:
        - bearerAuth: []
      parameters:
        - name: hostId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: sessionId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '204':
          description: Retry accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/mobile/hosts/{hostId}/sync:
    parameters:
      - $ref: '#/components/parameters/HostHeader'
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: syncMobileProjection
      tags: [Synchronization]
      summary: Reconcile the Mobile projection after offline time or cursor loss
      description: >-
        The Server forwards the selected Desktop's authoritative Host and Session
        projection. Mobile applies the returned Session pages and, after the
        complete response has been consumed, removes any locally cached Session
        that is absent from the authoritative list. The Server does not track
        Mobile's local cache and therefore does not report per-client removals.
      security:
        - bearerAuth: []
      parameters:
        - name: hostId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/SyncCursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Authoritative Host and Session projection page, or a reset snapshot
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SyncData'
                  - $ref: '#/components/schemas/EncryptedPayload'
              examples:
                projection:
                  summary: Host-scoped synchronization projection
                  value:
                    cursor: "sync-cursor-01J8YQ6M7A"
                    resetRequired: false
                    host:
                      id: "host-01J8YQ6M7A"
                      displayName: "Development PC"
                      connectionState: connected
                      lastSeenAt: "2026-10-02T01:47:22.778Z"
                      agentVersion: "0.1.0"
                    sessions:
                      - id: "session-01J8YQ6M7B"
                        title: "Investigate remote control"
                        kind: primary
                        project:
                          id: "project-01J8YQ6M7C"
                          displayName: "suncode"
                        state: idle
                        updatedAt: "2026-10-02T01:45:10Z"
                        preview: "Review the remote control contract"
                        pendingApproval: false
                        pendingQuestion: false
                    hasMore: false
                encrypted:
                  summary: End-to-end encrypted synchronization response
                  value:
                    encPayload: "e2e-v1:base64url-ciphertext"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          description: Cursor expired; response instructs the client to perform a full reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseRetError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    HostHeader:
      name: X-Host-Id
      in: header
      required: true
      description: Host identity associated with this Mobile request.
      schema: { type: string, minLength: 1, maxLength: 200 }
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      description: Unique request ID used for correlation and mutation deduplication. Reuse it when retrying the same logical request.
      schema: { type: string, minLength: 1, maxLength: 200 }
    ProjectFilter:
      name: projectId
      in: query
      required: false
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    SyncCursor:
      name: cursor
      in: query
      required: false
      description: Last durable Mobile projection cursor. Omit for a full reset snapshot.
      schema: { type: string }
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Last applied SSE event ID for this Session. Omit on a new stream to receive session.snapshot.
      schema: { type: string, minLength: 1, maxLength: 200 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  responses:
    InvalidRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ApiBaseRetError'
              - $ref: '#/components/schemas/EncryptedPayload'
    Unauthorized:
      description: Access credential is missing, expired, or invalid
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ApiBaseRetError'
              - $ref: '#/components/schemas/EncryptedPayload'
    NotFound:
      description: Requested Host, Project, Session, or interaction was not found
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ApiBaseRetError'
              - $ref: '#/components/schemas/EncryptedPayload'
    Conflict:
      description: State or request ID conflict
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ApiBaseRetError'
              - $ref: '#/components/schemas/EncryptedPayload'
    DesktopUnavailable:
      description: Remote Server is reachable but the selected Desktop is unavailable
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ApiBaseRetError'
              - $ref: '#/components/schemas/EncryptedPayload'
    ServiceUnavailable:
      description: Remote Server health is not ready
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ApiBaseRetError'
              - $ref: '#/components/schemas/EncryptedPayload'
    PlainInvalidRequest:
      description: Request validation failed; pairing and token refresh bodies are plaintext.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlainApiBaseRetError' }
    PlainUnauthorized:
      description: Access credential is missing, expired, or invalid; token refresh responses are plaintext.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlainApiBaseRetError' }
    PlainDesktopUnavailable:
      description: Selected Desktop is unavailable; pairing responses are plaintext.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlainApiBaseRetError' }
  schemas:
    EmptySuccessResponse:
      type: object
      additionalProperties: false
    ApiError:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: integer
          description: Application error code.
        message:
          type: string
          description: Safe human-readable error message.
    ApiBaseRetError:
      oneOf:
        - $ref: '#/components/schemas/ApiError'
        - $ref: '#/components/schemas/EncryptedPayload'
    PlainApiBaseRetError:
      $ref: '#/components/schemas/ApiError'
    EncryptedPayload:
      type: object
      required: [encPayload]
      additionalProperties: false
      properties:
        encPayload:
          type: string
          minLength: 1
          description: Opaque end-to-end encrypted body. The Server forwards this value without decrypting or interpreting it.
          examples:
            - "e2e-v1:base64url-ciphertext"
    PairingExchangeRequest:
      type: object
      required: [pairingCode, deviceName]
      additionalProperties: false
      properties:
        pairingCode:
          type: string
          minLength: 1
          description: One-time code generated by the Remote Server and bound to the Host. Desktop only embeds it in the QR payload; the Server consumes it atomically on the first successful exchange.
        deviceName:
          type: string
          minLength: 1
          maxLength: 120
    PairingExchangeData:
      type: object
      required: [accessToken, refreshToken, accessTokenExpiresAt, host]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        host: { $ref: '#/components/schemas/PairedHost' }
    PairedHost:
      type: object
      required: [id, displayName, connectionState]
      properties:
        id: { type: string }
        displayName: { type: string }
        connectionState: { $ref: '#/components/schemas/ConnectionState' }
        agentVersion: { type: [string, "null"] }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken: { type: string }
    TokenData:
      type: object
      required: [accessToken, refreshToken, accessTokenExpiresAt]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
    HealthData:
      type: object
      required: [status, serverTime]
      properties:
        status: { type: string, enum: [ok, degraded] }
        serverTime: { type: string, format: date-time }
    Host:
      type: object
      required: [id, displayName, connectionState, lastSeenAt]
      properties:
        id: { type: string }
        displayName: { type: string }
        connectionState: { $ref: '#/components/schemas/ConnectionState' }
        lastSeenAt: { type: [string, "null"], format: date-time }
        agentVersion: { type: [string, "null"] }
    HostDetail:
      type: object
      required: [id, displayName, connectionState, lastSeenAt]
      properties:
        id: { type: string }
        displayName: { type: string }
        connectionState: { $ref: '#/components/schemas/ConnectionState' }
        lastSeenAt: { type: [string, "null"], format: date-time }
        agentVersion: { type: [string, "null"] }
    Project:
      type: object
      required: [id, displayName, activeSessionCount]
      properties:
        id: { type: string }
        displayName: { type: string }
        relativeRoot: { type: [string, "null"], description: Display-safe project-relative root; never an absolute path. }
        activeSessionCount: { type: integer, minimum: 0 }
    ProjectsData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Project' }
    SessionPageData:
      type: object
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SessionSummary' }
        nextCursor: { type: [string, "null"] }
        hasMore: { type: boolean }
    SessionSummary:
      allOf:
        - $ref: '#/components/schemas/SessionSummaryBase'
        - type: object
          properties:
            pendingApproval: { type: boolean }
            pendingQuestion: { type: boolean }
    SessionSummaryBase:
      type: object
      required: [id, title, kind, project, state, updatedAt, preview]
      properties:
        id: { type: string }
        title: { type: string }
        kind: { type: string, const: primary }
        project: { $ref: '#/components/schemas/ProjectRef' }
        state: { $ref: '#/components/schemas/SessionState' }
        updatedAt: { type: string, format: date-time }
        preview: { type: string, maxLength: 500 }
    SessionState:
      type: string
      enum: [idle, running, waiting_for_approval, waiting_for_answer, failed]
    SessionDetailData:
      allOf:
        - $ref: '#/components/schemas/SessionSummaryBase'
        - type: object
          required: [messages, revision, archived]
          properties:
            revision: { type: integer, minimum: 0 }
            eventSequence:
              type: integer
              minimum: 0
              description: Latest retained per-Session SSE sequence represented by this snapshot.
            archived: { type: boolean, const: false }
            messages:
              type: array
              items: { $ref: '#/components/schemas/Message' }
            pendingApproval:
              oneOf:
                - $ref: '#/components/schemas/ApprovalRequest'
                - type: 'null'
            pendingQuestion:
              oneOf:
                - $ref: '#/components/schemas/QuestionRequest'
                - type: 'null'
    HostRef:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string }
        displayName: { type: string }
    ProjectRef:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string }
        displayName: { type: string }
    Message:
      type: object
      required: [id, role, text, createdAt]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant, thinking] }
        text: { type: string }
        createdAt: { type: string, format: date-time }
    ApprovalRequest:
      type: object
      required: [id, revision, risk, summary, createdAt]
      properties:
        id: { type: string }
        revision: { type: integer, minimum: 0 }
        risk: { type: string, enum: [filesystem, process, network, external, destructive, other] }
        summary: { type: string }
        detail: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    QuestionRequest:
      type: object
      required: [id, revision, prompt, options, createdAt]
      properties:
        id: { type: string }
        revision: { type: integer, minimum: 0 }
        prompt: { type: string }
        options:
          type: array
          items: { type: string }
        allowsFreeText: { type: boolean, default: false }
        createdAt: { type: string, format: date-time }
    CreateSessionRequest:
      type: object
      required: [projectId]
      additionalProperties: false
      properties:
        projectId: { type: string }
        title: { type: string, maxLength: 200 }
        firstMessage: { type: string, maxLength: 20000 }
        images:
          type: array
          maxItems: 3
          description: Optional images attached to the first user message.
          items:
            $ref: '#/components/schemas/ImageInput'
    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 20000 }
        images:
          type: array
          maxItems: 3
          description: Optional images attached to this user message.
          items:
            $ref: '#/components/schemas/ImageInput'
    ImageInput:
      type: object
      required: [mimeType, data]
      additionalProperties: false
      properties:
        mimeType:
          type: string
          enum: [image/png, image/jpeg, image/gif, image/webp, image/bmp, image/avif]
        data:
          type: string
          contentEncoding: base64
          minLength: 1
          description: Base64-encoded image bytes. The Server forwards this value without interpreting the image.
        fileName:
          type: [string, "null"]
          maxLength: 255
    ApprovalResolutionRequest:
      type: object
      required: [action, expectedRevision]
      additionalProperties: false
      properties:
        action: { type: string, enum: [allow_once, allow_session, deny] }
        expectedRevision: { type: integer, minimum: 0 }
    QuestionReplyRequest:
      type: object
      required: [answers, expectedRevision]
      additionalProperties: false
      properties:
        answers:
          type: array
          items: { type: string }
        expectedRevision: { type: integer, minimum: 0 }
    SessionCreatedData:
      type: object
      required: [sessionId]
      additionalProperties: false
      properties:
        sessionId: { type: string }
    SessionSseStreamItem:
      oneOf:
        - $ref: '#/components/schemas/SessionSnapshotSseItem'
        - $ref: '#/components/schemas/AgentEventSseItem'
      description: One parsed event item in the sequential text/event-stream response.
    SessionSnapshotSseItem:
      type: object
      required: [event, id, data]
      additionalProperties: false
      properties:
        event: { type: string, const: session.snapshot }
        id: { type: string, minLength: 1, description: Same value as data.event_id. }
        data:
          type: string
          description: JSON-serialized plaintext SessionSnapshotEnvelope or an object containing only encPayload.
          contentMediaType: application/json
          contentSchema:
            $ref: '#/components/schemas/SessionSnapshotDataEnvelope'
    AgentEventSseItem:
      type: object
      required: [event, id, data]
      additionalProperties: false
      properties:
        event: { type: string, const: agent.event }
        id: { type: string, minLength: 1, description: Same value as data.event_id. }
        data:
          type: string
          description: JSON-serialized plaintext AgentEventEnvelope or an object containing only encPayload.
          contentMediaType: application/json
          contentSchema:
            $ref: '#/components/schemas/AgentEventDataEnvelope'
    SessionSnapshotDataEnvelope:
      oneOf:
        - $ref: '#/components/schemas/SessionSnapshotEnvelope'
        - $ref: '#/components/schemas/EncryptedPayload'
      description: Exactly one plaintext snapshot or encrypted payload representation.
    AgentEventDataEnvelope:
      oneOf:
        - $ref: '#/components/schemas/AgentEventEnvelope'
        - $ref: '#/components/schemas/EncryptedPayload'
      description: Exactly one plaintext agent event or encrypted payload representation.
    SessionSnapshotEnvelope:
      type: object
      required: [event_id, session_id, sequence, session_revision, snapshot]
      additionalProperties: false
      description: |
        JSON data carried by `session.snapshot`. A new connection without
        `Last-Event-ID` receives this snapshot before live events. On reconnect
        with a retained cursor, the server replays events after that cursor
        without sending an older snapshot. Snapshot capture and live-subscription
        registration are atomic with event publication.
      properties:
        event_id: { type: string, minLength: 1, description: Stable SSE id for this snapshot frame. }
        session_id: { type: string, minLength: 1 }
        sequence: { type: integer, minimum: 0, description: Last event sequence represented by this snapshot. }
        session_revision: { type: integer, minimum: 0, description: Session state revision represented by this snapshot. }
        snapshot: { $ref: '#/components/schemas/SessionDetailData' }
    AgentEventEnvelope:
      type: object
      required: [event_id, sequence, session_revision, session_id, occurred_at, event_type, payload]
      additionalProperties: false
      properties:
        event_id: { type: string, minLength: 1, description: Stable SSE id; matches the frame id. }
        sequence: { type: integer, minimum: 0, description: Monotonic per-Session sequence used for replay and deduplication. }
        session_revision: { type: integer, minimum: 0, description: Non-decreasing Session revision after this event. }
        session_id: { type: string, minLength: 1 }
        occurred_at: { type: string, format: date-time }
        event_type:
          type: string
          description: Transport discriminator derived from EventPayload::event_type().
          enum: [turn.state, tool.state, tool.requested, tool.result, tool.output, message.user, message.assistant, message.tool, assistant.delta, turn.queued, turn.completed, usage.updated, context.compacted, provider.exchange.started, provider.exchange.progress, provider.exchange.completed, provider.exchange.failed, approval.requested, approval.resolved, question.asked, question.replied, question.rejected, todo.updated, checkpoint.captured, checkpoint.item_restored, checkpoint.restore_failed, checkpoint.restored]
        payload:
          $ref: '#/components/schemas/AgentEventPayload'
    AgentEventPayload:
      description: Payload shape is selected by AgentEventEnvelope.event_type; event payloads may add fields compatibly.
      anyOf:
        - $ref: '#/components/schemas/TurnStatePayload'
        - $ref: '#/components/schemas/ToolStatePayload'
        - $ref: '#/components/schemas/ToolRequestedPayload'
        - $ref: '#/components/schemas/ToolResultPayload'
        - $ref: '#/components/schemas/ToolOutputPayload'
        - $ref: '#/components/schemas/MessageUserPayload'
        - $ref: '#/components/schemas/MessageAssistantPayload'
        - $ref: '#/components/schemas/MessageToolPayload'
        - $ref: '#/components/schemas/AssistantDeltaPayload'
        - $ref: '#/components/schemas/TurnQueuedPayload'
        - $ref: '#/components/schemas/TurnCompletedPayload'
        - $ref: '#/components/schemas/UsageUpdatedPayload'
        - $ref: '#/components/schemas/ContextCompactedPayload'
        - $ref: '#/components/schemas/ProviderExchangeStartedPayload'
        - $ref: '#/components/schemas/ProviderExchangeProgressPayload'
        - $ref: '#/components/schemas/ProviderExchangeCompletedPayload'
        - $ref: '#/components/schemas/ProviderExchangeFailedPayload'
        - $ref: '#/components/schemas/ApprovalRequestedPayload'
        - $ref: '#/components/schemas/ApprovalResolvedPayload'
        - $ref: '#/components/schemas/QuestionAskedPayload'
        - $ref: '#/components/schemas/QuestionAnsweredPayload'
        - $ref: '#/components/schemas/TodoUpdatedPayload'
        - $ref: '#/components/schemas/CheckpointCapturedPayload'
        - $ref: '#/components/schemas/CheckpointItemRestoredPayload'
        - $ref: '#/components/schemas/CheckpointRestoreFailedPayload'
        - $ref: '#/components/schemas/CheckpointRestoredPayload'
    AgentJsonValue:
      type: [object, array, string, number, boolean, "null"]
      description: Any JSON value emitted as an Agent event argument or result.
    TurnStatePayload:
      type: object
      required: [turn_id, state, model_id, submission_idempotency_key, reason]
      properties:
        turn_id: { type: string }
        state: { type: string }
        model_id: { type: [string, "null"] }
        submission_idempotency_key: { type: [string, "null"] }
        reason: { type: [string, "null"] }
    ToolStatePayload:
      type: object
      required: [turn_id, call_id, tool_call_id, name, state, reason]
      properties:
        turn_id: { type: string }
        call_id: { type: [string, "null"] }
        tool_call_id: { type: string }
        name: { type: string }
        state: { type: string }
        reason: { type: [string, "null"] }
    ToolRequestedPayload:
      type: object
      required: [turn_id, call_id, tool_call_id, name, arguments, ordinal]
      properties:
        turn_id: { type: string }
        call_id: { type: [string, "null"] }
        tool_call_id: { type: string }
        name: { type: string }
        arguments: { $ref: '#/components/schemas/AgentJsonValue' }
        ordinal: { type: integer, minimum: 0 }
    ToolResultPayload:
      type: object
      required: [turn_id, call_id, tool_call_id, result]
      properties:
        turn_id: { type: string }
        call_id: { type: [string, "null"] }
        tool_call_id: { type: string }
        result: { $ref: '#/components/schemas/AgentJsonValue' }
    ToolOutputPayload:
      type: object
      required: [turn_id, call_id, tool_call_id, stream, chunk_base64]
      properties:
        turn_id: { type: string }
        call_id: { type: [string, "null"] }
        tool_call_id: { type: string }
        stream: { type: string, enum: [stdout, stderr] }
        chunk_base64: { type: string, contentEncoding: base64 }
    MessageUserPayload:
      type: object
      required: [message_id, turn_id, message]
      properties:
        message_id: { type: string }
        turn_id: { type: string }
        queued_id: { type: [string, "null"] }
        queued_idempotency_key: { type: [string, "null"] }
        message: { $ref: '#/components/schemas/AgentMessage' }
    MessageAssistantPayload:
      type: object
      required: [message_id, turn_id, call_id, message, usage, finish_reason]
      properties:
        message_id: { type: string }
        turn_id: { type: string }
        call_id: { type: [string, "null"] }
        message: { $ref: '#/components/schemas/AgentMessage' }
        usage: { $ref: '#/components/schemas/AgentUsage' }
        finish_reason: { type: string }
    MessageToolPayload:
      type: object
      required: [turn_id, call_id, tool_call_id, message]
      properties:
        turn_id: { type: string }
        call_id: { type: [string, "null"] }
        tool_call_id: { type: string }
        message: { $ref: '#/components/schemas/AgentMessage' }
    AssistantDeltaPayload:
      type: object
      required: [turn_id, text]
      properties:
        turn_id: { type: string }
        text: { type: string }
    TurnQueuedPayload:
      type: object
      required: [queued_id, active_turn_id, position]
      properties:
        queued_id: { type: string }
        active_turn_id: { type: string }
        position: { type: integer, minimum: 0 }
    TurnCompletedPayload:
      type: object
      required: [turn_id, usage, iterations, tool_calls]
      properties:
        turn_id: { type: string }
        usage: { $ref: '#/components/schemas/AgentUsage' }
        iterations: { type: integer, minimum: 0 }
        tool_calls: { type: integer, minimum: 0 }
    UsageUpdatedPayload:
      type: object
      required: [turn_id, usage]
      properties:
        turn_id: { type: string }
        usage: { $ref: '#/components/schemas/AgentUsage' }
    ContextCompactedPayload:
      type: object
      required: [exchange_id, turn_id, provider, model_id, wire_model, iteration, started_at, original_characters, retained_characters, original_tokens, retained_tokens, dropped_messages, summary]
      properties:
        exchange_id: { type: string }
        turn_id: { type: string }
        provider: { type: string }
        model_id: { type: string }
        wire_model: { type: string }
        iteration: { type: integer, minimum: 0 }
        started_at: { type: string, format: date-time }
        original_characters: { type: integer, minimum: 0 }
        retained_characters: { type: integer, minimum: 0 }
        original_tokens: { type: integer, minimum: 0 }
        retained_tokens: { type: integer, minimum: 0 }
        dropped_messages: { type: integer, minimum: 0 }
        summary:
          oneOf:
            - $ref: '#/components/schemas/ContextSummary'
            - type: 'null'
    ContextSummary:
      type: object
      required: [objective, important_constraints, completed_work, active_work, blockers, next_action]
      properties:
        objective: { type: string }
        important_constraints: { type: array, items: { type: string } }
        completed_work: { type: array, items: { type: string } }
        active_work: { type: array, items: { type: string } }
        blockers: { type: array, items: { type: string } }
        next_action: { type: string }
    ProviderExchangeStartedPayload:
      type: object
      required: [exchange_id, turn_id, provider, model_id, wire_model, iteration]
      properties:
        exchange_id: { type: string }
        turn_id: { type: string }
        provider: { type: string }
        model_id: { type: string }
        wire_model: { type: string }
        iteration: { type: integer, minimum: 0 }
    ProviderExchangeProgressPayload:
      type: object
      required: [exchange_id, turn_id, provider, model_id, uploaded_bytes, downloaded_bytes]
      properties:
        exchange_id: { type: string }
        turn_id: { type: string }
        provider: { type: string }
        model_id: { type: string }
        uploaded_bytes: { type: integer, minimum: 0 }
        downloaded_bytes: { type: integer, minimum: 0 }
    ProviderExchangeCompletedPayload:
      type: object
      required: [exchange_id, turn_id, output_message, tool_calls, usage, provider_request_id, provider_response_id, finish_reason]
      properties:
        exchange_id: { type: string }
        turn_id: { type: string }
        output_message: { $ref: '#/components/schemas/AgentMessage' }
        tool_calls: { type: array, items: { $ref: '#/components/schemas/AgentToolCall' } }
        usage:
          oneOf:
            - $ref: '#/components/schemas/ProviderUsage'
            - type: 'null'
        provider_request_id: { type: [string, "null"] }
        provider_response_id: { type: [string, "null"] }
        finish_reason: { type: string }
    ProviderExchangeFailedPayload:
      type: object
      required: [exchange_id, turn_id, error, provider_request_id]
      properties:
        exchange_id: { type: string }
        turn_id: { type: string }
        error: { $ref: '#/components/schemas/ProviderError' }
        provider_request_id: { type: [string, "null"] }
    ProviderError:
      type: object
      required: [code, message, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
    ApprovalRequestedPayload:
      type: object
      required: [turn_id, tool_call_id, approval_id, operation, arguments]
      properties:
        turn_id: { type: string }
        tool_call_id: { type: string }
        approval_id: { type: string }
        operation: { type: string }
        arguments: { $ref: '#/components/schemas/AgentJsonValue' }
    ApprovalResolvedPayload:
      type: object
      required: [approval_id, turn_id, decision]
      properties:
        approval_id: { type: string }
        turn_id: { type: string }
        decision: { type: string }
    QuestionAskedPayload:
      type: object
      required: [request_id, turn_id, tool_call_id, questions]
      properties:
        request_id: { type: string }
        turn_id: { type: string }
        tool_call_id: { type: string }
        questions: { $ref: '#/components/schemas/AgentJsonValue' }
    QuestionAnsweredPayload:
      type: object
      required: [request_id, turn_id, tool_call_id, answers]
      properties:
        request_id: { type: string }
        turn_id: { type: string }
        tool_call_id: { type: string }
        answers:
          type: array
          items:
            type: array
            items: { type: string }
    TodoUpdatedPayload:
      type: object
      required: [turn_id, call_id, tool_call_id, todos]
      properties:
        turn_id: { type: string }
        call_id: { type: [string, "null"] }
        tool_call_id: { type: string }
        todos: { type: array, items: { $ref: '#/components/schemas/TodoEventItem' } }
    TodoEventItem:
      type: object
      required: [content, status, priority]
      properties:
        content: { type: string }
        status: { type: string }
        priority: { type: string }
    CheckpointCapturedPayload:
      type: object
      required: [turn_id, tool_call_id, manifest_id, checkpoint_id, path, ordinal]
      properties:
        turn_id: { type: string }
        tool_call_id: { type: string }
        manifest_id: { type: string }
        checkpoint_id: { type: string }
        path: { type: [string, "null"] }
        ordinal: { type: integer }
    CheckpointItemRestoredPayload:
      type: object
      required: [manifest_id, checkpoint_id, path]
      properties:
        manifest_id: { type: string }
        checkpoint_id: { type: string }
        path: { type: [string, "null"] }
    CheckpointRestoreFailedPayload:
      type: object
      required: [manifest_id, status, code]
      properties:
        manifest_id: { type: string }
        status: { type: string }
        code: { type: [string, "null"] }
    CheckpointRestoredPayload:
      type: object
      required: [manifest_id, restored_items]
      properties:
        manifest_id: { type: string }
        restored_items: { type: integer, minimum: 0 }
    AgentMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string }
        content: { type: array, items: { $ref: '#/components/schemas/AgentContentPart' } }
        tool_calls: { type: array, items: { $ref: '#/components/schemas/AgentToolCall' } }
        tool_call_id: { type: [string, "null"] }
    AgentContentPart:
      type: object
      required: [type, text]
      properties:
        type: { type: string }
        text: { type: string }
    AgentToolCall:
      type: object
      required: [call_id, name, arguments]
      properties:
        call_id: { type: string }
        name: { type: string }
        arguments: { $ref: '#/components/schemas/AgentJsonValue' }
        toolset_name: { type: [string, "null"] }
    AgentUsage:
      type: object
      required: [input_tokens, output_tokens, total_tokens]
      properties:
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
    ProviderUsage:
      allOf:
        - $ref: '#/components/schemas/AgentUsage'
        - type: object
          properties:
            cache_read_tokens: { type: [integer, "null"], minimum: 0 }
            cache_miss_tokens: { type: [integer, "null"], minimum: 0 }
            cache_write_tokens: { type: [integer, "null"], minimum: 0 }
            reasoning_tokens: { type: [integer, "null"], minimum: 0 }
    SyncData:
      type: object
      required: [cursor, resetRequired, host, sessions]
      additionalProperties: false
      properties:
        cursor: { type: string }
        resetRequired:
          type: boolean
          description: >-
            When true, the Mobile client must discard its previous sync cursor
            and cached Host/Session projection and replace it with this complete
            synchronization result (including all following pages). When false,
            the client may continue from the supplied cursor.
        host: { $ref: '#/components/schemas/SyncHost' }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/SessionSummary' }
        hasMore: { type: boolean, default: false }
    SyncHost:
      type: object
      required: [id, displayName, connectionState, lastSeenAt, agentVersion]
      additionalProperties: false
      properties:
        id: { type: string }
        displayName: { type: string }
        connectionState: { $ref: '#/components/schemas/ConnectionState' }
        lastSeenAt: { type: [string, "null"], format: date-time }
        agentVersion: { type: [string, "null"] }
    ConnectionState:
      type: string
      enum: [connected, connecting, degraded, offline, unauthorized, incompatible]
