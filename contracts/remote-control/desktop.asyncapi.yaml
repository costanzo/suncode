asyncapi: 3.0.0
info:
  title: SunCode Desktop Remote Device Contract
  version: 1.0.0
  description: |
    Private outbound contract used by a paired SunCode Desktop. Desktop
    receives remote commands as server-sent events and posts command results
    and selected Rust AgentEvent values over HTTP.
servers:
  remoteServer:
    host: '{remoteServerHost}'
    protocol: https
    pathname: /v1/desktop
    variables:
      remoteServerHost:
        default: relay.suncode.example
channels:
  desktopRequests:
    address: /v1/desktop/requests/{hostId}
    messages:
      desktopRequest:
        $ref: '#/components/messages/DesktopRequest'
  desktopResults:
    address: /v1/desktop/results/{hostId}
    messages:
      desktopResult:
        $ref: '#/components/messages/DesktopResult'
  desktopEvents:
    address: /v1/desktop/events/{hostId}
    messages:
      desktopEvent:
        $ref: '#/components/messages/DesktopEvent'
operations:
  receiveDesktopRequests:
    action: receive
    channel: { $ref: '#/channels/desktopRequests' }
    messages: [{ $ref: '#/channels/desktopRequests/messages/desktopRequest' }]
  postDesktopResult:
    action: send
    channel: { $ref: '#/channels/desktopResults' }
    messages: [{ $ref: '#/channels/desktopResults/messages/desktopResult' }]
  postDesktopEvent:
    action: send
    channel: { $ref: '#/channels/desktopEvents' }
    messages: [{ $ref: '#/channels/desktopEvents/messages/desktopEvent' }]
components:
  messages:
    DesktopRequest:
      name: desktop.request
      payload:
        type: object
        required: [request_id, operation, arguments]
        properties:
          request_id: { type: string, minLength: 1 }
          operation:
            type: string
            enum: [projects.list, sessions.list, session.create, session.send_message, session.cancel, session.retry, approval.resolve, question.reply]
          arguments: { type: object, additionalProperties: true }
    DesktopResult:
      name: desktop.result
      payload:
        type: object
        required: [request_id, success]
        properties:
          request_id: { type: string, minLength: 1 }
          success: { type: boolean }
          data: { type: object, nullable: true, additionalProperties: true }
          error: { type: object, nullable: true, additionalProperties: true }
    DesktopEvent:
      name: desktop.event
      payload:
        type: object
        required: [session_id, occurred_at, event_type, payload]
        properties:
          session_id: { type: string }
          occurred_at: { type: string, format: date-time }
          event_type:
            type: string
            description: Explicit upload allowlist; assistant.delta is excluded.
          payload: { type: object, additionalProperties: true }
