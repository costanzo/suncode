asyncapi: 3.0.0
info:
  title: SunCode Server-to-Desktop Command Stream
  version: 1.0.0
  description: |
    Private server-to-Desktop Server-Sent Events stream. Desktop first obtains
    hostId and desktopToken through desktop.openapi.yaml, then opens the
    requestsUrl returned by that response. The stream is receive-only: command
    results and Rust session events use the Desktop HTTP contract.
servers:
  remoteServer:
    host: '{remoteServerHost}'
    protocol: https
    pathname: /v1/desktop/events
    description: Authenticated Desktop SSE endpoint.
    variables:
      remoteServerHost:
        default: relay.suncode.example
    security:
      - desktopBearer: []
        desktopHostId: []
channels:
  desktopCommands:
    address: /v1/desktop/events
    messages:
      desktopConnected:
        $ref: '#/components/messages/DesktopConnected'
      desktopCommand:
        $ref: '#/components/messages/DesktopCommand'
operations:
  receiveDesktopCommands:
    action: receive
    channel:
      $ref: '#/channels/desktopCommands'
    messages:
      - $ref: '#/channels/desktopCommands/messages/desktopConnected'
      - $ref: '#/channels/desktopCommands/messages/desktopCommand'
components:
  securitySchemes:
    desktopBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
    desktopHostId:
      type: apiKey
      in: header
      name: X-Host-Id
  messages:
    DesktopConnected:
      name: desktop.connected
      payload:
        type: object
        required: [hostId]
        properties:
          hostId: { type: string, minLength: 1 }
    DesktopCommand:
      name: desktop.command
      payload:
        $ref: '#/components/schemas/DesktopCommand'
  schemas:
    DesktopCommand:
      type: object
      required: [requestId, hostId, command, payload]
      additionalProperties: false
      properties:
        requestId: { type: string, minLength: 1 }
        hostId: { type: string, minLength: 1 }
        sessionId: { type: string, nullable: true }
        command:
          type: string
          enum:
            - projects.list
            - sessions.list
            - session.create
            - session.get
            - session.message
            - turn.cancel
            - turn.retry
            - approval.resolve
            - question.reply
        payload:
          $ref: '#/components/schemas/DesktopCommandPayload'
    DesktopCommandPayload:
      type: object
      description: |
        Command-specific fields are carried in one stable camelCase object.
        Unknown fields are ignored. A command that does not need arguments uses
        an empty object.
      additionalProperties: true
      properties:
        projectId: { type: string, nullable: true }
        cursor: { type: string, nullable: true }
        limit: { type: integer, minimum: 1, maximum: 100, nullable: true }
        hostId: { type: string, nullable: true }
        title: { type: string, nullable: true }
        firstMessage: { type: string, nullable: true }
        text: { type: string, nullable: true }
        clientMessageId: { type: string, nullable: true }
        approvalId: { type: string, nullable: true }
        action: { type: string, enum: [allow_once, allow_session, deny], nullable: true }
        expectedRevision: { type: integer, minimum: 0, nullable: true }
        questionId: { type: string, nullable: true }
        answers:
          type: array
          items: { type: string }
        turnId: { type: string, nullable: true }
