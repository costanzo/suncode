asyncapi: 3.0.0
info:
  title: SunCode Desktop Remote Device Contract
  version: 1.0.0
  description: |
    Private outbound contract used by a paired SunCode Desktop. The first
    pairing request uses the configured pairing code and returns a host ID,
    Desktop bearer token, Mobile pairing payload, and endpoint paths. Desktop
    receives Java DesktopCommand values as SSE and posts command results,
    snapshots, and selected Rust AgentEvent values over HTTP.
servers:
  remoteServer:
    host: '{remoteServerHost}'
    protocol: https
    pathname: /v1/desktop
    variables:
      remoteServerHost:
        default: relay.suncode.example
channels:
  desktopRequests:
    address: /v1/desktop/events
    messages:
      desktopRequest:
        $ref: '#/components/messages/DesktopRequest'
  desktopResults:
    address: /v1/desktop/responses
    messages:
      desktopResult:
        $ref: '#/components/messages/DesktopResult'
  desktopEvents:
    address: /v1/desktop/events
    messages:
      desktopEvent:
        $ref: '#/components/messages/DesktopEvent'
operations:
  receiveDesktopCommands:
    action: receive
    channel: { $ref: '#/channels/desktopRequests' }
    messages: [{ $ref: '#/channels/desktopRequests/messages/desktopRequest' }]
  postDesktopResponse:
    action: send
    channel: { $ref: '#/channels/desktopResults' }
    messages: [{ $ref: '#/channels/desktopResults/messages/desktopResult' }]
  postDesktopEvent:
    action: send
    channel: { $ref: '#/channels/desktopEvents' }
    messages: [{ $ref: '#/channels/desktopEvents/messages/desktopEvent' }]
components:
  messages:
    DesktopRequest:
      name: desktop.command
      payload:
        type: object
        required: [requestId, hostId, command, payload]
        properties:
          requestId: { type: string, minLength: 1 }
          hostId: { type: string, minLength: 1 }
          sessionId: { type: string, nullable: true }
          command:
            type: string
            enum: [projects.list, sessions.list, session.create, session.get, session.message, turn.cancel, turn.retry, approval.resolve, question.reply]
          payload: { type: object, additionalProperties: true }
    DesktopResult:
      name: desktop.result
      payload:
        type: object
        required: [requestId, success]
        properties:
          requestId: { type: string, minLength: 1 }
          hostId: { type: string, minLength: 1 }
          sessionId: { type: string, nullable: true }
          success: { type: boolean }
          code: { type: integer, nullable: true }
          message: { type: string, nullable: true }
          payload: { type: object, nullable: true, additionalProperties: true }
    DesktopEvent:
      name: desktop.event
      payload:
        type: object
        required: [session_id, occurred_at, event_type, payload]
        properties:
          session_id: { type: string }
          occurred_at: { type: string, format: date-time }
          event_type:
            type: string
            description: Explicit upload allowlist; assistant.delta is excluded.
          payload: { type: object, additionalProperties: true }
