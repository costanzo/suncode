openapi: 3.2.0
info:
  title: SunCode Desktop Remote Device HTTP API
  version: 1.0.0
  description: |
    Private HTTP half of the outbound Desktop device protocol. A Desktop first
    exchanges the configured pairing code for a server-issued hostId, accessToken,
    and refreshToken plus the accessTokenExpiresAt timestamp and one-time
    mobilePairingCode generated by the Server. Desktop embeds that code, its
    hostId, and a locally generated AES key in a QR link for Mobile. Every
    request after pairing carries X-Host-Id and the bearer token. Desktop
    refreshes its credentials through POST /v1/desktop/auth/refresh. The
    authenticated Desktop Mobile-request SSE stream is documented as a GET
    response in this contract.
servers:
  - url: https://{remoteServerHost}
    variables:
      remoteServerHost:
        default: relay.suncode.example
tags:
  - name: Pairing
  - name: Authentication
  - name: Snapshot
  - name: Events
  - name: Results
paths:
  /v1/desktop/pairings:
    post:
      operationId: pairDesktop
      tags: [Pairing]
      summary: Exchange the configured pairing code for Desktop credentials
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesktopPairingRequest'
            examples:
              plaintext:
                value:
                  pairingCode: "482917"
                  displayName: "Long's Desktop"
                  agentVersion: "0.1.0"
      responses:
        '200':
          description: Server-issued Desktop credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesktopPairingPayload'
              examples:
                plaintext:
                  value:
                    hostId: "host-01J8YQ6M7A"
                    accessToken: "desktop-access-token-issued-by-server"
                    refreshToken: "desktop-refresh-token-issued-by-server"
                    accessTokenExpiresAt: "2026-10-02T02:47:22.778Z"
                    mobilePairingCode: "mobile-pairing-code-once"
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/desktop/auth/refresh:
    post:
      operationId: refreshDesktopAccessToken
      tags: [Authentication]
      summary: Rotate the Desktop access token
      description: |
        Exchanges the current Desktop refresh token for a new access token.
        The request and response are plaintext because the Remote Server owns
        Desktop credential validation. The returned access token expiration
        replaces the previous expiration. The mobile pairing code and AES key
        are not changed by token refresh. AES-key rotation is a separate
        Desktop-local operation: the old key is invalidated and Mobile must
        pair again using a new QR link.
      security: []
      parameters:
        - $ref: '#/components/parameters/HostId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesktopRefreshTokenRequest'
            examples:
              plaintext:
                value:
                  refreshToken: "desktop-refresh-token-issued-by-server"
      responses:
        '200':
          description: Rotated Desktop credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesktopTokenData'
              examples:
                plaintext:
                  value:
                    accessToken: "desktop-access-token-rotated-by-server"
                    refreshToken: "desktop-refresh-token-rotated-by-server"
                    accessTokenExpiresAt: "2026-10-02T03:47:22.778Z"
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/desktop/snapshot:
    post:
      operationId: uploadDesktopSnapshot
      tags: [Snapshot]
      summary: Upload the current Desktop projection
      security:
        - desktopBearer: []
      parameters:
        - $ref: '#/components/parameters/HostId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesktopSnapshot'
            examples:
              plaintext:
                summary: Unencrypted Desktop projection
                value:
                  projects:
                    - projectId: "project-01"
                      userId: "local-user"
                      canonicalRoot: "C:/workspaces/example"
                      displayName: "example"
                      createdAt: "2026-10-01T02:00:00Z"
                      updatedAt: "2026-10-01T02:30:00Z"
                      lastOpenedAt: "2026-10-01T02:30:00Z"
                      archivedAt: null
                  sessions:
                    - sessionId: "session-01"
                      projectId: "project-01"
                      title: "Investigate remote control"
                      modelId: "gpt-5.5"
                      reasoningEffort: "medium"
                      kind: "primary"
                      parentSessionId: null
                      agentId: null
                      agentVersion: null
                      status: "idle"
                      createdAt: "2026-10-01T02:05:00Z"
                      updatedAt: "2026-10-01T02:30:00Z"
                      lastActivityAt: "2026-10-01T02:30:00Z"
                      archivedAt: null
                      pinAt: null
              encrypted:
                summary: End-to-end encrypted Desktop projection
                value:
                  encPayload: "e2e-v1:base64url-ciphertext"
      responses:
        '200':
          description: Snapshot accepted
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/EmptySuccessResponse'
                  - $ref: '#/components/schemas/EncryptedPayload'
              examples:
                plaintext:
                  value: {}
                encrypted:
                  value:
                    encPayload: "e2e-v1:base64url-ciphertext"
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/desktop/events:
    get:
      operationId: receiveDesktopMobileRequests
      tags: [Events]
      summary: Receive forwarded Mobile HTTP requests as Server-Sent Events
      description: |
        Opens a receive-only SSE stream. The server sends `desktop.connected`
        after connection, then one route-specific `mobile.*` event for each
        Mobile HTTP request that is forwarded to this Desktop. The SSE event ID
        is that HTTP request's `X-Request-Id`. Successful pairing and logout
        operations also emit sanitized lifecycle notifications; pairing payloads
        and credentials are never sent. Other Server-owned operations (including
        health, token refresh, Host detail, and sync) are not forwarded. SSE
        comments may be sent as heartbeats.
      security:
        - desktopBearer: []
      parameters:
        - $ref: '#/components/parameters/HostId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Continuous stream of Desktop connection and forwarded Mobile HTTP request events
          content:
            text/event-stream:
              schema:
                type: array
                description: Sequential SSE stream represented as its parsed event items.
                items:
                  $ref: '#/components/schemas/DesktopSseStreamItem'
              itemSchema:
                $ref: '#/components/schemas/DesktopSseStreamItem'
              examples:
                connected:
                  summary: Desktop connection established
                  value:
                    - event: desktop.connected
                      id: host-01J8YQ6M7A
                      data: '{"hostId":"host-01J8YQ6M7A"}'
                mobilePairingSucceeded:
                  summary: Mobile pairing exchange succeeded
                  value:
                    - event: mobile.pairings.exchange.succeeded
                      id: mobile-request-pair-01
                      data: '{"pathParam":{},"queryParam":{},"requestBody":{"pairingCode":"482917","deviceName":"Phone"}}'
                mobileLogout:
                  summary: Current Mobile credential logged out
                  value:
                    - event: mobile.auth.logout
                      id: mobile-request-logout-01
                      data: '{"pathParam":{},"queryParam":{},"requestBody":{}}'
                listHostProjects:
                  summary: Mobile GET /hosts/{hostId}/projects
                  value:
                    - event: mobile.projects.list
                      id: mobile-request-01
                      data: '{"pathParam":{"hostId":"host-01J8YQ6M7A"},"queryParam":{},"requestBody":{}}'
                listSessions:
                  summary: Mobile GET /hosts/{hostId}/sessions
                  value:
                    - event: mobile.sessions.list
                      id: mobile-request-02
                      data: '{"pathParam":{"hostId":"host-01J8YQ6M7A"},"queryParam":{"projectId":"project-01","cursor":"cursor-01","limit":50},"requestBody":{}}'
                createSession:
                  summary: Mobile POST /hosts/{hostId}/sessions
                  value:
                    - event: mobile.sessions.create
                      id: mobile-request-03
                      data: '{"pathParam":{"hostId":"host-01J8YQ6M7A"},"queryParam":{},"requestBody":{"projectId":"project-01","title":"New session","firstMessage":"Inspect this project","images":[{"mimeType":"image/png","data":"iVBORw0KGgoAAAANSUhEUgAAAAEAAAAB","fileName":"context.png"}]}}'
                getSession:
                  summary: Mobile GET /hosts/{hostId}/sessions/{sessionId}
                  value:
                    - event: mobile.sessions.get
                      id: mobile-request-04
                      data: '{"pathParam":{"hostId":"host-01J8YQ6M7A","sessionId":"session-01"},"queryParam":{},"requestBody":{}}'
                openSessionEventStream:
                  summary: Mobile GET /hosts/{hostId}/sessions/{sessionId}/events
                  value:
                    - event: mobile.sessions.events.open
                      id: mobile-request-04a
                      data: '{"pathParam":{"hostId":"host-01J8YQ6M7A","sessionId":"session-01"},"queryParam":{},"requestBody":{}}'
                sendMessage:
                  summary: Mobile POST /hosts/{hostId}/sessions/{sessionId}/messages
                  value:
                    - event: mobile.sessions.messages.send
                      id: mobile-request-05
                      data: '{"pathParam":{"hostId":"host-01J8YQ6M7A","sessionId":"session-01"},"queryParam":{},"requestBody":{"text":"Continue the task","images":[{"mimeType":"image/jpeg","data":"/9j/4AAQSkZJRgABAQAAAQABAAD","fileName":"context.jpg"}]}}'
                resolveApproval:
                  summary: Mobile POST /hosts/{hostId}/sessions/{sessionId}/approvals/{approvalId}
                  value:
                    - event: mobile.sessions.approvals.resolve
                      id: mobile-request-06
                      data: '{"pathParam":{"hostId":"host-01J8YQ6M7A","sessionId":"session-01","approvalId":"approval-01"},"queryParam":{},"requestBody":{"action":"allow_once","expectedRevision":7}}'
                replyQuestion:
                  summary: Mobile POST /hosts/{hostId}/sessions/{sessionId}/questions/{questionId}/reply
                  value:
                    - event: mobile.sessions.questions.reply
                      id: mobile-request-07
                      data: '{"pathParam":{"hostId":"host-01J8YQ6M7A","sessionId":"session-01","questionId":"question-01"},"queryParam":{},"requestBody":{"answers":["Option A"],"expectedRevision":8}}'
                cancelTurn:
                  summary: Mobile POST /hosts/{hostId}/sessions/{sessionId}/cancel
                  value:
                    - event: mobile.sessions.cancel
                      id: mobile-request-08
                      data: '{"pathParam":{"hostId":"host-01J8YQ6M7A","sessionId":"session-01"},"queryParam":{},"requestBody":{}}'
                retryTurn:
                  summary: Mobile POST /hosts/{hostId}/sessions/{sessionId}/retry
                  value:
                    - event: mobile.sessions.retry
                      id: mobile-request-09
                      data: '{"pathParam":{"hostId":"host-01J8YQ6M7A","sessionId":"session-01"},"queryParam":{},"requestBody":{}}'
                encryptedRequest:
                  summary: End-to-end encrypted Mobile HTTP request
                  value:
                    - event: mobile.sessions.messages.send
                      id: mobile-request-10
                      data: '{"pathParam":{"hostId":"host-01J8YQ6M7A","sessionId":"session-01"},"queryParam":{},"encPayload":"e2e-v1:base64url-ciphertext"}'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: uploadDesktopEvent
      tags: [Events]
      summary: Upload one allowlisted Rust session event
      security:
        - desktopBearer: []
      parameters:
        - $ref: '#/components/parameters/HostId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesktopEvent'
            examples:
              plaintext:
                summary: Unencrypted Desktop event
                value:
                  session_id: "session-01"
                  occurred_at: "2026-10-01T02:30:00Z"
                  event_type: "message.assistant"
                  payload:
                    turn_id: "turn-01"
                    message_id: "message-01"
              encrypted:
                summary: End-to-end encrypted Desktop event
                value:
                  encPayload: "e2e-v1:base64url-ciphertext"
      responses:
        '200':
          description: Event accepted
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/EmptySuccessResponse'
                  - $ref: '#/components/schemas/EncryptedPayload'
              examples:
                plaintext:
                  value: {}
                encrypted:
                  value:
                    encPayload: "e2e-v1:base64url-ciphertext"
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/desktop/responses:
    post:
      operationId: postDesktopResponse
      tags: [Results]
      summary: Complete a Server-issued Desktop command
      security:
        - desktopBearer: []
      parameters:
        - $ref: '#/components/parameters/HostId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesktopResponse'
            examples:
              plaintext:
                summary: Unencrypted Desktop response
                value:
                  sessionId: "session-01"
                  status: "idle"
              encrypted:
                summary: End-to-end encrypted Desktop response
                value:
                  encPayload: "e2e-v1:base64url-ciphertext"
      responses:
        '200':
          description: Response accepted
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/EmptySuccessResponse'
                  - $ref: '#/components/schemas/EncryptedPayload'
              examples:
                plaintext:
                  value: {}
                encrypted:
                  value:
                    encPayload: "e2e-v1:base64url-ciphertext"
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          description: The command timed out or was already completed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiError'
                  - $ref: '#/components/schemas/EncryptedPayload'
              examples:
                plaintext:
                  value:
                    code: 410
                    message: "desktop command expired"
                encrypted:
                  value:
                    encPayload: "e2e-v1:base64url-ciphertext"

components:
  securitySchemes:
    desktopBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Access token returned by POST /v1/desktop/pairings.
  parameters:
    HostId:
      name: X-Host-Id
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
  responses:
    InvalidRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ApiError'
              - $ref: '#/components/schemas/EncryptedPayload'
    Unauthorized:
      description: Access token or host ID is missing or invalid
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ApiError'
              - $ref: '#/components/schemas/EncryptedPayload'
    NotFound:
      description: Host or command was not found
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ApiError'
              - $ref: '#/components/schemas/EncryptedPayload'
  schemas:
    EmptySuccessResponse:
      type: object
      additionalProperties: false
    ApiError:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code: { type: integer, description: Application error code. }
        message: { type: string, description: Safe human-readable error message. }
    EncryptedPayload:
      type: object
      required: [encPayload]
      additionalProperties: false
      properties:
        encPayload:
          type: string
          minLength: 1
          description: Opaque end-to-end encrypted body. The Server forwards this value without decrypting or interpreting it.
          examples:
            - "e2e-v1:base64url-ciphertext"
    DesktopPairingRequest:
      type: object
      required: [pairingCode]
      additionalProperties: false
      properties:
        pairingCode: { type: string, minLength: 1, maxLength: 256 }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        agentVersion: { type: string, maxLength: 120 }
    DesktopPairingPayload:
      type: object
      required: [hostId, accessToken, refreshToken, accessTokenExpiresAt, mobilePairingCode]
      properties:
        hostId: { type: string, minLength: 1 }
        accessToken: { type: string, minLength: 1, description: Bearer access token for subsequent Desktop HTTP and SSE requests. }
        refreshToken: { type: string, minLength: 1, description: Opaque token used to obtain a new access token. }
        accessTokenExpiresAt: { type: string, format: date-time, description: Expiration instant for accessToken. }
        mobilePairingCode: { type: string, minLength: 1, description: One-time opaque code generated by the Remote Server and bound to this Host. Desktop embeds it in the QR payload; the Server consumes it on the first successful Mobile exchange. }
    DesktopRefreshTokenRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken: { type: string, minLength: 1 }
    DesktopTokenData:
      type: object
      required: [accessToken, refreshToken, accessTokenExpiresAt]
      additionalProperties: false
      properties:
        accessToken: { type: string, minLength: 1 }
        refreshToken: { type: string, minLength: 1 }
        accessTokenExpiresAt: { type: string, format: date-time }
    DesktopSnapshot:
      oneOf:
        - $ref: '#/components/schemas/DesktopPlainSnapshot'
        - $ref: '#/components/schemas/DesktopEncryptedSnapshot'
      description: |
        Current Desktop projection uploaded by the Rust Desktop worker. The
        request must use exactly one representation: either the explicit
        plaintext projection or the opaque end-to-end encrypted payload. The
        two representations must never be mixed. The Remote Server must
        forward `encPayload` without decoding or interpreting its contents.
    DesktopPlainSnapshot:
      type: object
      required: [projects, sessions]
      additionalProperties: false
      properties:
        projects:
          type: array
          description: Projects visible to this Desktop. `canonicalRoot` is Desktop-local data and must never be exposed to Mobile.
          items:
            $ref: '#/components/schemas/DesktopProject'
        sessions:
          type: array
          description: Sessions visible to this Desktop. Child sessions may be included in the Desktop projection.
          items:
            $ref: '#/components/schemas/DesktopSession'
    DesktopEncryptedSnapshot:
      type: object
      required: [encPayload]
      additionalProperties: false
      properties:
        encPayload:
          type: string
          minLength: 1
          description: Opaque end-to-end encrypted payload. The Server forwards it and does not decrypt or inspect it.
          examples:
            - "e2e-v1:base64url-ciphertext"
    DesktopProject:
      type: object
      required: [projectId, userId, canonicalRoot, displayName, createdAt, updatedAt, lastOpenedAt, archivedAt]
      additionalProperties: false
      properties:
        projectId: { type: string, minLength: 1 }
        userId: { type: string, minLength: 1 }
        canonicalRoot: { type: string, minLength: 1, description: Desktop-local canonical path; never expose this value to Mobile. }
        displayName: { type: string, minLength: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastOpenedAt: { type: string, format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
    DesktopSession:
      type: object
      required: [sessionId, projectId, title, modelId, reasoningEffort, kind, parentSessionId, agentId, agentVersion, status, createdAt, updatedAt, lastActivityAt, archivedAt, pinAt]
      additionalProperties: false
      properties:
        sessionId: { type: string, minLength: 1 }
        projectId: { type: [string, "null"] }
        title: { type: [string, "null"] }
        modelId: { type: [string, "null"] }
        reasoningEffort: { type: [string, "null"] }
        kind: { type: string, minLength: 1 }
        parentSessionId: { type: [string, "null"] }
        agentId: { type: [string, "null"] }
        agentVersion: { type: [integer, "null"] }
        status: { type: string, minLength: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastActivityAt: { type: string, format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
        pinAt: { type: [string, "null"], format: date-time }
    DesktopEvent:
      oneOf:
        - $ref: '#/components/schemas/DesktopPlainEvent'
        - $ref: '#/components/schemas/DesktopEncryptedEvent'
      description: |
        A Desktop event must use exactly one representation. In encrypted
        mode the request body contains only `encPayload`; the Server forwards
        it without decoding or interpreting its contents.
    DesktopPlainEvent:
      type: object
      required: [session_id, occurred_at, event_type, payload]
      additionalProperties: false
      properties:
        session_id: { type: string, minLength: 1 }
        occurred_at: { type: string, format: date-time }
        event_type:
          type: string
          description: Allowlisted event type; assistant.delta and provider byte progress are excluded.
        payload: { type: object, additionalProperties: true }
    DesktopEncryptedEvent:
      type: object
      required: [encPayload]
      additionalProperties: false
      properties:
        encPayload:
          type: string
          minLength: 1
          description: Opaque end-to-end encrypted event. The Server forwards it without decoding or interpreting its contents.
          examples:
            - "e2e-v1:base64url-ciphertext"
    DesktopResponse:
      oneOf:
        - $ref: '#/components/schemas/DesktopResponsePayload'
        - $ref: '#/components/schemas/DesktopErrorResponse'
        - $ref: '#/components/schemas/DesktopEncryptedResponse'
      description: |
        A Desktop response must use exactly one representation. Successful
        plaintext results expose the command payload at the top level. Errors
        use `code` and `message`. In encrypted mode the request body contains
        only `encPayload`; the Server forwards it without decoding or
        interpreting its contents. Request and host correlation are supplied
        by the HTTP headers.
    DesktopResponsePayload:
      type: object
      properties:
        code: { type: 'null' }
        message: { type: 'null' }
        encPayload: { type: 'null' }
      additionalProperties: true
    DesktopErrorResponse:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code: { type: integer, description: Application error code. }
        message: { type: string, description: Safe human-readable error message. }
    DesktopEncryptedResponse:
      type: object
      required: [encPayload]
      additionalProperties: false
      properties:
        encPayload:
          type: string
          minLength: 1
          description: Opaque end-to-end encrypted response. The Server forwards it without decoding or interpreting its contents.
          examples:
            - "e2e-v1:base64url-ciphertext"
    DesktopSseStreamItem:
      oneOf:
        - $ref: '#/components/schemas/DesktopConnectedSseItem'
        - $ref: '#/components/schemas/DesktopMobileHttpRequestSseItem'
      description: One SSE frame after parsing the text/event-stream framing.
    DesktopConnectedSseItem:
      type: object
      required: [event, id, data]
      additionalProperties: false
      properties:
        event: { type: string, const: desktop.connected }
        id: { type: string, description: SSE event ID; the Host ID for this frame. }
        data:
          type: string
          description: JSON-serialized DesktopConnectedData carried by the SSE data field.
          contentMediaType: application/json
          contentSchema:
            $ref: '#/components/schemas/DesktopConnectedData'
    DesktopConnectedData:
      type: object
      required: [hostId]
      additionalProperties: false
      properties:
        hostId: { type: string, minLength: 1 }
    DesktopMobileHttpRequestSseItem:
      type: object
      required: [event, id, data]
      additionalProperties: false
      properties:
        event:
          type: string
          enum:
            - mobile.projects.list
            - mobile.pairings.exchange.succeeded
            - mobile.auth.logout
            - mobile.sessions.list
            - mobile.sessions.create
            - mobile.sessions.get
            - mobile.sessions.events.open
            - mobile.sessions.messages.send
            - mobile.sessions.approvals.resolve
            - mobile.sessions.questions.reply
            - mobile.sessions.cancel
            - mobile.sessions.retry
          description: Route-specific custom event identifying the forwarded Mobile HTTP operation.
        id:
          type: string
          minLength: 1
          description: SSE event ID copied from the forwarded Mobile HTTP request's X-Request-Id.
        data:
          type: string
          description: |
            JSON string containing `pathParam`, `queryParam`, and either the
            plaintext `requestBody` or the encrypted `encPayload`. Pairing-success and logout lifecycle notifications
            are always sanitized plaintext and never contain credentials.
          contentMediaType: application/json
          contentSchema:
            $ref: '#/components/schemas/DesktopMobileHttpRequestDataEnvelope'
    DesktopMobileHttpRequestData:
      type: object
      required: [pathParam, queryParam, requestBody]
      additionalProperties: false
      properties:
        pathParam:
          type: object
          description: Decoded path parameters from the Mobile HTTP route; empty when the route has none.
          additionalProperties: true
        queryParam:
          type: object
          description: Decoded query parameters from the Mobile HTTP request; empty when none were supplied.
          additionalProperties: true
        requestBody:
          description: Parsed JSON request body; an empty object is used when the request has no body.
    DesktopEncryptedMobileHttpRequestData:
      type: object
      required: [pathParam, queryParam, encPayload]
      additionalProperties: false
      properties:
        pathParam:
          type: object
          description: Decoded path parameters from the Mobile HTTP route; always visible for Desktop routing.
          additionalProperties: true
        queryParam:
          type: object
          description: Decoded query parameters from the Mobile HTTP request; always visible for Desktop routing.
          additionalProperties: true
        encPayload:
          type: string
          minLength: 1
          description: Opaque encrypted request body. The Server forwards it without decryption.
          examples:
            - "e2e-v1:base64url-ciphertext"
    DesktopMobileHttpRequestDataEnvelope:
      oneOf:
        - $ref: '#/components/schemas/DesktopMobileHttpRequestData'
        - $ref: '#/components/schemas/DesktopEncryptedMobileHttpRequestData'
      description: Request routing values are always visible. The body is either plaintext `requestBody` or opaque encrypted `encPayload`; the two body representations are mutually exclusive.
