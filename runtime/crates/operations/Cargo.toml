[package]
name = "suncode-tool"
version = "0.1.0"
edition = "2021"

[lib]
name = "suncode_tool"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
