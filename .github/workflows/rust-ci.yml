name: Rust CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Override the repository's stable channel for every Rust CI command.
  RUSTUP_TOOLCHAIN: '1.98.0'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: Format, build, and test Rust crates
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Identify Rust compiler
        id: rust
        shell: bash
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      - name: Cache shared Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            target
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: rust-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.cargo/config.toml') }}

      - name: Check formatting
        run: |
          cargo fmt --manifest-path agent/Cargo.toml --all -- --check
          cargo fmt --manifest-path sdks/rust/Cargo.toml -- --check
          cargo fmt --manifest-path sdks/c/Cargo.toml -- --check
          cargo fmt --manifest-path apps/cli/Cargo.toml -- --check

      - name: Check locked dependency metadata
        run: |
          cargo metadata --manifest-path agent/Cargo.toml --locked --no-deps --format-version 1 >/dev/null
          cargo metadata --manifest-path sdks/rust/Cargo.toml --locked --no-deps --format-version 1 >/dev/null
          cargo metadata --manifest-path sdks/c/Cargo.toml --locked --no-deps --format-version 1 >/dev/null
          cargo metadata --manifest-path apps/cli/Cargo.toml --locked --no-deps --format-version 1 >/dev/null

      - name: Lint agent workspace
        run: cargo clippy --manifest-path agent/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Test agent workspace
        run: cargo test --manifest-path agent/Cargo.toml --workspace --all-targets --locked

      - name: Test Rust SDK
        run: cargo test --manifest-path sdks/rust/Cargo.toml --lib --locked

      - name: Test C ABI crate
        run: cargo test --manifest-path sdks/c/Cargo.toml --lib --locked

      - name: Test native CLI
        run: cargo test --manifest-path apps/cli/Cargo.toml --locked
