[package]
name = "suncode-sdk"
version = "0.1.0"
edition = "2021"

[lib]
name = "suncode_sdk"
path = "src/lib.rs"

[dependencies]
base64 = "0.23.1"
aes-gcm = "0.11.1"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
futures-core = "0.3"
futures-util = "0.3.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
suncode-core = { path = "../../agent/crates/core" }
suncode-common = { path = "../../agent/crates/common" }
suncode-computer = { path = "../../agent/crates/computer" }
suncode-config = { path = "../../agent/crates/config" }
suncode-data = { path = "../../agent/crates/data" }
suncode-llm = { path = "../../agent/crates/llm" }
suncode-remote = { path = "../../agent/crates/remote" }
suncode-skills = { path = "../../agent/crates/skills" }
suncode-tool = { path = "../../agent/crates/tools" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.20"
uuid = { version = "1.29.1", features = ["v4", "serde"] }
url = "2"

[dev-dependencies]
axum = "0.8"
flate2 = "1.1.11"
futures-util = "0.3.34"
tempfile = "3"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
