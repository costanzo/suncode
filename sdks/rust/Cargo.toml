[package]
name = "suncode-sdk"
version = "0.1.0"
edition = "2021"

[lib]
name = "suncode_sdk"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
suncode-agent = { path = "../../agent/crates/core" }
suncode-common = { path = "../../agent/crates/common" }
suncode-config = { path = "../../agent/crates/config" }
suncode-data = { path = "../../agent/crates/data" }
suncode-llm = { path = "../../agent/crates/llm" }
suncode-tool = { path = "../../agent/crates/tools" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

[dev-dependencies]
axum = "0.8"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
