[package]
name = "suncode-cli"
version = "0.1.0"
edition = "2021"
description = "Native command-line client for the embedded SunCode agent"
license = "UNLICENSED"

[[bin]]
name = "suncode"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
suncode-sdk = { path = "../../sdks/rust" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
