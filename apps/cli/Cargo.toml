[package]
name = "suncode-cli"
version = "0.1.0"
edition = "2021"
description = "Native command-line client for the embedded SunCode agent"
license = "UNLICENSED"

[[bin]]
name = "suncode"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
suncode-sdk = { path = "../../sdks/rust" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync"] }
