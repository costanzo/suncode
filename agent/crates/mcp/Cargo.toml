[package]
name = "suncode-mcp"
version.workspace = true
edition.workspace = true

[lib]
name = "suncode_mcp"
path = "src/lib.rs"

[dependencies]
futures-util.workspace = true
http.workspace = true
reqwest = { workspace = true, features = ["system-proxy"] }
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
suncode-common.workspace = true
suncode-http.workspace = true
tokio = { workspace = true, features = ["process", "sync", "time"] }
tokio-util.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["server", "transport-async-rw"] }
