[package]
name = "suncode-mcp"
version = "0.1.0"
edition = "2021"

[lib]
name = "suncode_mcp"
path = "src/lib.rs"

[dependencies]
futures-util = "0.3"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rmcp = { version = "=3.2.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
suncode-common = { path = "../common" }
tokio = { version = "1", features = ["process", "sync", "time"] }
tokio-util = "0.7"

[dev-dependencies]
rmcp = { version = "=3.2.0", default-features = false, features = ["client", "server", "transport-async-rw", "transport-child-process", "transport-streamable-http-client-reqwest"] }
