[package]
name = "suncode-data"
version = "0.1.0"
edition = "2021"

[lib]
name = "suncode_data"
path = "src/lib.rs"

[dependencies]
chrono = "0.4"
diesel = { version = "2.2", features = ["sqlite"] }
# Unify Diesel's SQLite backend with the bundled native build for desktop
# releases, avoiding a machine-provided sqlite3.lib/DLL on Windows.
libsqlite3-sys = { version = "0.30.1", features = ["bundled"] }
suncode-common = { path = "../common" }
suncode-database = { path = "../database" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
tempfile = "3"
