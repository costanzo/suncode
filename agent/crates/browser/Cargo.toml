[package]
name = "suncode-browser"
version = "0.1.0"
edition = "2021"

[lib]
name = "suncode_browser"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
chromiumoxide = "0.9.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
suncode-common = { path = "../common" }
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
