[package]
name = "suncode-browser"
version = "0.1.0"
edition = "2021"

[lib]
name = "suncode_browser"
path = "src/lib.rs"

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
suncode-common = { path = "../common" }
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
