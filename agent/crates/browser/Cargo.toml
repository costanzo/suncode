[package]
name = "suncode-browser"
version = "0.1.0"
edition = "2021"

[lib]
name = "suncode_browser"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
suncode-common = { path = "../common" }
tokio = { version = "1", features = ["io-util", "process", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
