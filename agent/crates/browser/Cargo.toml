[package]
name = "suncode-browser"
version = "0.1.0"
edition = "2021"

[lib]
name = "suncode_browser"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
chromiumoxide = "0.9.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
suncode-common = { path = "../common" }
tokio = { version = "1", features = ["macros", "sync", "time"] }
