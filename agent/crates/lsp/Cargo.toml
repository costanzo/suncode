edition.workspace = true

[lib]
name = "suncode_lsp"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
suncode-common.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "sync", "time"] }
