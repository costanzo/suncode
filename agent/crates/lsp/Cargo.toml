[package]
name = "suncode-lsp"
version = "0.1.0"
edition = "2021"

[lib]
name = "suncode_lsp"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
suncode-common = { path = "../common" }
tokio = { version = "1", features = ["io-util", "process", "sync", "time"] }
tokio-util = "0.7"
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
