[package]
name = "suncode-db"
version = "0.1.0"
edition = "2021"

[lib]
name = "suncode_db"
path = "src/lib.rs"

[dependencies]
chrono = "0.4"
diesel = { version = "2.2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
