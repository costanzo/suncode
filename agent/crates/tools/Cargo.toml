[package]
name = "suncode-tool"
version = "0.1.0"
edition = "2021"

[lib]
name = "suncode_tool"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
encoding_rs = "0.8"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
html-escape = "0.2"
html2md-rs = "0.12"
ignore = "0.4"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
suncode-common = { path = "../common" }
suncode-http = { path = "../http", features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
