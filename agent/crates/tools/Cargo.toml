[package]
name = "suncode-tool"
version.workspace = true
edition.workspace = true

[lib]
name = "suncode_tool"
path = "src/lib.rs"

[dependencies]
base64.workspace = true
encoding_rs.workspace = true
globset.workspace = true
grep-matcher.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
html-escape.workspace = true
html2md-rs.workspace = true
ignore.workspace = true
libc.workspace = true
reqwest = { workspace = true, features = ["blocking", "system-proxy"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
suncode-common.workspace = true
suncode-documents.workspace = true
suncode-http = { workspace = true, features = ["blocking"] }
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
zip.workspace = true
